# /etc/rsyslog.conf configuration file for rsyslog (Alpine based Postfix MTA image)
#
# Design goals for this container:
#   * Every message produced by postfix, saslauthd, opendkim and rsyslog
#     itself must end up on the persistent /data/log volume - nothing is
#     written to the container's ephemeral /var/log.
#   * Nothing is dropped: input rate limiting is disabled and a catch-all
#     rule takes every facility that has no dedicated file.
#   * Log files are rotated by rsyslog itself (omfile rotation.*): the
#     container has no cron/logrotate. The helper script archives,
#     compresses and prunes the old files, so disk usage is bounded.
#
# NOTE: do not combine this with postfix's own "maillog_file" logging
# (see MAILLOG_README). If postfix writes its own file via maillog_file,
# remove the mail.* rule below or every message is logged twice.


#################
#### MODULES ####
#################

# Local system logging (/dev/log).
# SysSock.RateLimit.Interval=0 disables the built-in rate limit: a busy
# MTA exceeds the default burst easily and rsyslog would silently drop
# messages - losing log lines is exactly what this setup must avoid.
module(load="imuxsock" SysSock.RateLimit.Interval="0")

# Kernel logging is not available inside containers (/proc/kmsg is not
# readable), so imklog is disabled.
#module(load="imklog")

# UDP/TCP syslog reception is not needed: all producers log via /dev/log.
#module(load="imudp")
#input(type="imudp" port="514")
#module(load="imtcp")
#input(type="imtcp" port="514")


###########################
#### GLOBAL DIRECTIVES ####
###########################

#
# Where to place spool and state files
#
$WorkDirectory /var/spool/rsyslog

#
# Include all config files in /etc/rsyslog.d/
#
$IncludeConfig /etc/rsyslog.d/*.conf


###########
#### LOG ROTATION ####
###########
#
# rsyslog rotates a file when rotation.sizeLimit is exceeded, then calls
# /usr/local/sbin/rsyslog-rotate with the file name as argument. The
# script renames the file (rsyslog re-creates it), compresses the older
# archives and keeps only the newest 7 (gzip) archives.
# NOTE: the size limit is not exact - rsyslog may exceed it by a few KiB.
#
# 50 MiB per file x 8 files (1 live + 7 archives) = worst case ~400 MiB
# per log stream on the /data volume.


###############
#### RULES ####
###############
#
# Order matters: the catch-all rule must be the last one.

# Mail subsystem: postfix (via syslog) and opendkim.
mail.* action(
    type="omfile"
    file="/data/log/mail.log"
    fileOwner="root"
    fileGroup="adm"
    fileCreateMode="0640"
    dirCreateMode="0755"
    rotation.sizeLimit="52428800"
    rotation.sizeLimitCommand="/usr/local/sbin/rsyslog-rotate"
    rotation.sizeLimitCommandPassFileName="on"
)

# Authentication: saslauthd and friends.
auth,authpriv.* action(
    type="omfile"
    file="/data/log/auth.log"
    fileOwner="root"
    fileGroup="adm"
    fileCreateMode="0640"
    dirCreateMode="0755"
    rotation.sizeLimit="52428800"
    rotation.sizeLimitCommand="/usr/local/sbin/rsyslog-rotate"
    rotation.sizeLimitCommandPassFileName="on"
)

# Catch-all: everything that has no dedicated file above (daemon, user,
# local0-7, kern, ...). This guarantees that no facility is lost.
*.*;mail,auth,authpriv.none action(
    type="omfile"
    file="/data/log/syslog"
    fileOwner="root"
    fileGroup="adm"
    fileCreateMode="0640"
    dirCreateMode="0755"
    rotation.sizeLimit="52428800"
    rotation.sizeLimitCommand="/usr/local/sbin/rsyslog-rotate"
    rotation.sizeLimitCommandPassFileName="on"
)
